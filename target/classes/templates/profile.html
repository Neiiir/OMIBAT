<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profil | OMIBAT</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><div th:replace="~{fragments :: side(${role})}"></div><main class="main"><header><div><small>AKUN</small><h1>Profil Saya</h1><p>Informasi identitas yang terdaftar di OMIBAT.</p></div></header><section class="panel profile"><div class="avatar large">♡</div><h2 th:text="${profile.nama}"></h2><p class="muted" th:text="${role == 'CAREGIVER' ? 'Caregiver' : 'Orang Tua'}"></p><dl><dt>NIK</dt><dd th:text="${profile.nik}"></dd><dt>Nomor telepon</dt><dd th:text="${profile.telepon == null ? 'Belum diisi' : profile.telepon}"></dd></dl></section></main></div></body></html>
