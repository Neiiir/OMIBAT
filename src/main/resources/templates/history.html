<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Riwayat Kepatuhan | OMIBAT</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><div th:replace="~{fragments :: side(${role})}"></div><main class="main"><header><div><small>RIWAYAT</small><h1>Riwayat Kepatuhan</h1><p>Catatan konfirmasi konsumsi obat.</p></div></header><section class="panel"><div class="table-wrap"><table><thead><tr><th th:if="${role == 'CAREGIVER'}">Orang tua</th><th>Tanggal</th><th>Obat</th><th>Dosis</th><th>Jam konfirmasi</th><th>Status</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:if="${role == 'CAREGIVER'}" th:text="${r.nama_ortu}"></td><td th:text="${r.tgl_log}"></td><td th:text="${r.nama_obat}"></td><td th:text="${r.dosis}"></td><td th:text="${r.jam_konfirmasi == null ? '—' : r.jam_konfirmasi}"></td><td><span class="status done" th:text="${r.status_kepatuhan}"></span></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="muted">Belum ada riwayat konfirmasi.</td></tr></tbody></table></div></section></main></div></body></html>
