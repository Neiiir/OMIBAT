<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jadwal Obat | OMIBAT</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><div th:replace="~{fragments :: side('CAREGIVER')}"></div><main class="main"><header><div><small>CAREGIVER</small><h1>Kelola Jadwal Obat</h1><p>Atur jadwal obat untuk orang tua yang terhubung denganmu.</p></div></header><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="panel"><h2>Tambah jadwal obat</h2><form method="post" action="/caregiver/jadwal/simpan" class="form-grid"><label>Orang tua<select name="nikOrtu" required><option value="">Pilih orang tua</option><option th:each="p:${parents}" th:value="${p.nik_ortu}" th:text="${p.nama_ortu}"></option></select></label><label>Obat<select name="idObat" required><option value="">Pilih obat</option><option th:each="o:${medicines}" th:value="${o.id_obat}" th:text="${o.nama_obat+' ('+o.satuan+')'}"></option></select></label><label>Dosis<input name="dosis" placeholder="Contoh: 5 mg" required></label><label>Frekuensi<input name="frekuensi" placeholder="Contoh: 1x sehari" required></label><label>Aturan minum<input name="aturanMinum" placeholder="Contoh: Sesudah makan" required></label><label>Jam minum<input type="time" name="jamJadwal" required></label><div class="form-actions"><button class="btn primary">Simpan jadwal</button></div></form></section><section class="panel"><h2>Jadwal yang dikelola</h2><div class="table-wrap"><table><thead><tr><th>Orang tua</th><th>Obat</th><th>Dosis</th><th>Frekuensi</th><th>Jam</th><th>Aksi</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.nama_ortu}"></td><td th:text="${r.nama_obat+' ('+r.satuan+')'}"></td><td th:text="${r.dosis}"></td><td th:text="${r.frekuensi}"></td><td th:text="${r.jam_jadwal}"></td><td><form method="post" th:action="@{'/caregiver/jadwal/'+${r.id_jadwal}+'/hapus'}" onsubmit="return confirm('Hapus jadwal ini?')"><button class="btn danger small">Hapus</button></form></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="muted">Belum ada jadwal.</td></tr></tbody></table></div></section></main></div></body></html>
