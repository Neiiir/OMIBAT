<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jadwal Kontrol | OMIBAT</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><div th:replace="~{fragments :: side('CAREGIVER')}"></div><main class="main"><header><div><small>CAREGIVER</small><h1>Jadwal Kontrol</h1><p>Bantu orang tua mengingat jadwal kunjungan kesehatan.</p></div></header><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="panel"><h2>Tambah jadwal kontrol</h2><form method="post" action="/caregiver/kontrol/simpan" class="form-grid"><label>Orang tua<select name="nikOrtu" required><option value="">Pilih orang tua</option><option th:each="p:${parents}" th:value="${p.nik_ortu}" th:text="${p.nama_ortu}"></option></select></label><label>Fasilitas kesehatan<select name="idFaskes" required><option value="">Pilih fasilitas</option><option th:each="f:${facilities}" th:value="${f.id_faskes}" th:text="${f.nama_faskes+' · '+f.tipe_faskes}"></option></select></label><label>Dokter / Poli<input name="dokterPoli" required></label><label>Tanggal kontrol<input type="date" name="tglKontrol" required></label><div class="form-actions"><button class="btn primary">Simpan kontrol</button></div></form></section><section class="panel"><h2>Kontrol keluarga</h2><div class="table-wrap"><table><thead><tr><th>Orang tua</th><th>Fasilitas</th><th>Dokter / Poli</th><th>Tanggal</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.nama_ortu}"></td><td th:text="${r.nama_faskes}"></td><td th:text="${r.dokter_poli}"></td><td th:text="${r.tgl_kontrol}"></td></tr></tbody></table></div></section></main></div></body></html>
